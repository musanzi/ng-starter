<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-[background-color,border-color,box-shadow] duration-300"
  [class]="
    solidHeader()
      ? 'border-neutral-200/80 bg-white/95 shadow-sm backdrop-blur-xl  '
      : 'border-transparent bg-transparent'
  ">
  <nav class="mx-auto flex max-w-screen-2xl items-center py-4 justify-between px-6 sm:px-8 lg:px-16 xl:px-24 2xl:px-32">
    <a routerLink="/" class="flex items-center gap-1" (click)="closeMenu()">
      <!-- Logo intentionally omitted until a brand asset is available. -->
      <span class="text-xl font-bold tracking-tight text-neutral-950 transition-colors md:text-3xl">
        starter<span class="text-primary-500">.</span>
      </span>
    </a>

    <div class="hidden h-full items-center gap-8 lg:flex">
      @for (link of links; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive
          #desktopLink="routerLinkActive"
          [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
          class="flex h-full items-center py-2 border-b-2 px-0.5 pt-0.5 text-sm font-semibold transition-colors"
          [class]="navLinkClasses(desktopLink.isActive)">
          {{ link.label }}
        </a>
      }
    </div>

    <div class="hidden items-center gap-1 text-neutral-950 lg:flex">
      <a matButton="filled" routerLink="/auth/sign-in" class="rounded-md font-semibold py-2.5 px-4">
        Join the community
      </a>
    </div>

    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-full border shadow-sm transition-colors lg:hidden"
      [class]="
        !solidHeader()
          ? 'border-neutral-300 bg-white/10 text-neutral-950 hover:bg-black/5   '
          : 'border-neutral-200 bg-white text-neutral-900 hover:bg-neutral-100    '
      "
      (click)="toggleMenu()">
      <mat-icon [svgIcon]="isMenuOpen() ? 'x' : 'menu'" />
    </button>
  </nav>

  @if (isMenuOpen()) {
    <div
      id="mobile-navigation"
      class="border-t border-neutral-200 bg-white px-6 py-6 text-neutral-950 shadow-xl lg:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.label) {
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment ?? undefined"
            routerLinkActive
            #mobileLink="routerLinkActive"
            [routerLinkActiveOptions]="{ paths: 'exact', fragment: 'exact' }"
            ariaCurrentWhenActive="page"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-base font-semibold transition"
            [class]="mobileNavLinkClasses(mobileLink.isActive)"
            (click)="closeMenu()">
            <mat-icon class="size-5" [svgIcon]="link.icon" />
            {{ link.label }}
          </a>
        }
      </div>
      <div class="mt-3 grid grid-cols-1 gap-3">
        <a
          routerLink="/auth/sign-in"
          class="flex items-center justify-center gap-2 rounded-md border border-neutral-200 px-4 py-3 text-center font-semibold text-neutral-900 transition-colors hover:bg-neutral-100"
          (click)="closeMenu()">
          <mat-icon class="size-5" svgIcon="log-in" />
          Sign in
        </a>
      </div>
    </div>
  }
</header>
